# User-tunable settings for the gitea-to-local-git synchronizer.
#
# This file is sourced by shared-helpers.sh at script startup. Edit the values
# below to customize behavior. After editing:
#   - bidirectional-sync and orphan-ref-pruner pick up changes on their next run.
#   - ref-change-watcher is a long-running daemon; restart it with
#       sudo systemctl restart gitea-to-local-git-synchronizer-watcher.service
#     to apply changes to DEBOUNCE_MS, RESCAN_SECONDS, or HEARTBEAT_SECONDS.


# How long the watcher waits after a burst of file changes before actually
# running a sync, in MILLISECONDS. A push that rewrites several branches at
# once produces many file events in rapid succession; the debounce collapses
# them into a single sync run. Higher = more coalescing, lower = faster
# reaction. Default: 150.
DEBOUNCE_MS=150


# How often the watcher runs a full sync even when nothing has changed, in
# SECONDS. Acts as a safety net: catches brand-new repos that weren't on the
# watch list yet, and covers any event the kernel might have dropped.
# Default: 60.
RESCAN_SECONDS=60


# How often the watcher writes a "still alive" heartbeat line to the activity
# log, in SECONDS. The watcher writes one heartbeat at most this often, so the
# log doesn't fill up with noise but you can still confirm the daemon is
# running. Default: 43200 (12 hours).
HEARTBEAT_SECONDS=43200


# Maximum number of lines kept in the activity log. After a sync run, if the
# log is longer than this, it's trimmed to the most recent LOG_MAX_LINES
# entries. Each log entry is followed by a blank line, so a value of 1000
# holds roughly 500 entries. Default: 1000.
LOG_MAX_LINES=1000


# How many repos to request per page when listing your Gitea account's repos
# via the API. Larger values mean fewer HTTP round-trips if you have many
# repos, but heavier individual requests. If you change this, the sync script
# uses the same value both to request a page AND to detect the last page, so
# pagination stays correct automatically. Default: 50.
GITEA_API_PAGE_SIZE=50


# Automatic pruning of dangling commits and orphan Gitea pull-request refs.
# When true (default), orphan-ref-pruner runs every 5 minutes via cron AND
# is triggered immediately by bidirectional-sync whenever a branch or tag
# is deleted on either side, so the commit graph never shows ghost history.
# Turn off if you want to manage repository garbage collection on your own
# schedule, or you want to inspect unreachable commits before they're
# purged. When set to false, also remove the orphan-ref-pruner line from
# your crontab so the periodic safety net stops running too. The pruner
# script itself always runs when invoked by hand, regardless of this
# setting. Default: true.
AUTO_PRUNE=true
